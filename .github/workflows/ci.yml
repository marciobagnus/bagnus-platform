name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://bagnus:bagnus_ci_only@127.0.0.1:5432/bagnus_ci?schema=public
      NEXT_TELEMETRY_DISABLED: "1"

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bagnus
          POSTGRES_PASSWORD: bagnus_ci_only
          POSTGRES_DB: bagnus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bagnus -d bagnus_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Generate Next.js types
        run: npx next typegen

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint -- --max-warnings 0

      - name: Run unit tests
        run: node --import tsx --test tests/*/*.test.mjs

      - name: Build application
        run: npm run build

      - name: Start Next.js for API tests
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/bagnus-next.log 2>&1 &

          for i in {1..60}; do
            if curl --silent --fail "http://127.0.0.1:3000/login" > /dev/null; then
              echo "Next.js is ready"
              exit 0
            fi

            sleep 2
          done

          echo "Next.js did not start correctly"
          cat /tmp/bagnus-next.log
          exit 1

      - name: Run integration tests
        # Aggregate assertions share one database; keep test files isolated in time.
        run: node --import tsx --test --test-concurrency=1 tests/*/*.integration.test.ts
